version: "3"
services:
  mongodb:
    image: mongo:5.0
    restart: always
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=example
      - MONGO_INITDB_DATABASE=db_name
    volumes:
      - mongodata:/data/db
  server:
    build: ./server
    ports:
      - "3006:3006"
    environment:
      DB_URI: "mongodb://admin:example@mongodb:27017/db_name?authSource=admin"
      PORT: "3006"
    depends_on:
      - mongodb

  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      SERVER_URL: "http://server:3006"
    depends_on:
      - server
volumes:
  mongodata:
    driver: local
